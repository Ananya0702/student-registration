<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 30px 40px;
            width: 100%;
            max-width: 600px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h2 {
            color: #333333;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #666666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444444;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .gender-options {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }

        .gender-options label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit {
            background-color: #667eea;
            color: #ffffff;
        }

        .btn-submit:hover {
            background-color: #5a67d8;
        }

        .btn-reset {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .btn-reset:hover {
            background-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>Student Registration Form</h2>
            <p>Please complete all fields to register as a student.</p>
        </div>

        <form id="studentRegistrationForm" action="#" method="POST">
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter student's full name" required>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@student.edu" required>
            </div>

            <!-- Date of Birth -->
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender</label>
                <div class="gender-options">
                    <label>
                        <input type="radio" id="genderMale" name="gender" value="Male" required> Male
                    </label>
                    <label>
                        <input type="radio" id="genderFemale" name="gender" value="Female"> Female
                    </label>
                    <label>
                        <input type="radio" id="genderOther" name="gender" value="Other"> Other
                    </label>
                </div>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
            </div>

            <!-- Course / Department -->
            <div class="form-group">
                <label for="course">Course / Department</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>Select a course</option>
                    <option value="cs">Computer Science & Engineering</option>
                    <option value="it">Information Technology</option>
                    <option value="ee">Electrical Engineering</option>
                    <option value="me">Mechanical Engineering</option>
                    <option value="bba">Business Administration</option>
                </select>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label for="address">Residential Address</label>
                <textarea id="address" name="address" rows="3" placeholder="Enter permanent address" required></textarea>
            </div>

            <!-- Buttons -->
            <div class="btn-group">
                <button type="submit" id="submitBtn" class="btn btn-submit">Submit Registration</button>
                <button type="reset" id="resetBtn" class="btn btn-reset">Reset Form</button>
            </div>
        </form>
    </div>

</body>
</html>
